# OJS biadenrekacipta — vhost domain testojs.plusthe.site FINAL (Fase 10c)
# FastCGI ke container vpsplus-ojs-fpm (127.0.0.1:9000, network_mode host).
# Dipasang SETELAH certbot issue (path cert harus ada saat nginx -t).
server {
    listen 80;
    listen [::]:80;
    server_name testojs.plusthe.site;

    # certbot renewal webroot ACME
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testojs.plusthe.site;

    ssl_certificate     /etc/letsencrypt/live/testojs.plusthe.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testojs.plusthe.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/biadenrekacipta/ojs;
    index index.php;

    client_max_body_size 64M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # X-Robots-Tag sengaja TIDAK dipasang: situs jurnal harus terindeks.

    location ~ ^/(config\.inc\.php|\.git|cache/|lib/pkp/tests/|tests/|docs/) { deny all; }

    location ~ ^/public/.*\.(php|phtml|phar|php[0-9]?)$ { deny all; }

    location = /sitemap.xml { rewrite ^ /index/sitemap last; }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location / {
        try_files $uri $uri/ @ojsroute;
    }
    location @ojsroute {
        rewrite ^/index\.php(/.*)?$ /index.php$1 last;
        rewrite ^/(.*)$ /index.php/$1 last;
    }

    location ~ ^/index\.php(/.*)?$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
    }

    location ~* ^/(?!.*(api/|\$\$\$call\$\$\$)).*\.(css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
