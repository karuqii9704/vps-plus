# Containerized biadenrekacipta OJS 3.5.0-5 (Fase 10c)
# Pattern box ini: port loopback-only + nginx host stream/proxy.
# Network mode host agar 127.0.0.1:9000 (nginx host) dan 127.0.0.1:3306
# (mysql host, bind 127.0.0.1) keduanya reachable tanpa bridge tambahan.
#
# Bind mount pada path IDENTIK dengan host — nginx mengirim SCRIPT_FILENAME
# absolut host; kalau beda path, semua request 404 (ditemukan live 2026-09-09).
#
# JANGAN jalankan `docker compose down` dari direktori stack utama dengan
# --remove-orphans — service ini satu project name (vpsplus) supaya deploy.sh
# tetap bekerja; konsisten dengan catatan orphan-container di SKILL.
#
# `name:` is declared EXPLICITLY. Without it, compose derives the project from
# this file's directory ("ojs"), so a plain `compose up -d` here creates a
# second project and collides with the existing containers on container_name
# ("Conflict. The container name ... is already in use"). The running
# containers are labelled com.docker.compose.project=vpsplus; this makes the
# file agree with them, so no -p flag is needed and a fresh box lands in the
# same project as everything else.
name: vpsplus

services:
  ojs-fpm:
    build:
      context: .
      dockerfile: Dockerfile
    image: vpsplus-ojs:latest
    container_name: vpsplus-ojs-fpm
    restart: unless-stopped
    network_mode: host
    user: "33:33"
    volumes:
      - /var/www/biadenrekacipta/ojs:/var/www/biadenrekacipta/ojs
      - /var/www/biadenrekacipta/ojs-files:/var/www/biadenrekacipta/ojs-files
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ojs-queue:
    # Same image as ojs-fpm. This used to say `vpsplus-ojs:tools`, a tag nothing
    # in this repo ever created — it was made by hand with `docker tag` and was
    # the only thing keeping the queue and scheduler schedulable. On a fresh box
    # `compose up --build` would have built `:latest` only, and compose would
    # then try to PULL `:tools` from Docker Hub and fail, leaving both workers
    # dead. (Verified: the two tags pointed at one identical image ID.)
    image: vpsplus-ojs:latest
    container_name: vpsplus-ojs-queue
    restart: unless-stopped
    network_mode: host
    user: "33:33"
    # worker CLI: healthcheck TCP dari image tidak berlaku — disable
    healthcheck:
      test: ["NONE"]
    volumes:
      - /var/www/biadenrekacipta/ojs:/var/www/biadenrekacipta/ojs
      - /var/www/biadenrekacipta/ojs-files:/var/www/biadenrekacipta/ojs-files
    command: ["php", "lib/pkp/tools/jobs.php", "work"]

  ojs-scheduler:
    image: vpsplus-ojs:latest
    container_name: vpsplus-ojs-scheduler
    restart: unless-stopped
    network_mode: host
    user: "33:33"
    healthcheck:
      test: ["NONE"]
    volumes:
      - /var/www/biadenrekacipta/ojs:/var/www/biadenrekacipta/ojs
      - /var/www/biadenrekacipta/ojs-files:/var/www/biadenrekacipta/ojs-files
    command: ["php", "lib/pkp/tools/scheduler.php", "work"]
