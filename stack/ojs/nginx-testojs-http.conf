# OJS biadenrekacipta — vhost testojs.plusthe.site (Tahap A: HTTP only, Fase 10c)
# Setelah cert terbit, file ini DIGANTI nginx-testojs.conf (redirect + 443).
server {
    listen 80;
    listen [::]:80;
    server_name testojs.plusthe.site;

    # certbot webroot ACME
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    root /var/www/biadenrekacipta/ojs;
    index index.php;

    client_max_body_size 64M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # X-Robots-Tag sengaja TIDAK dipasang: situs jurnal harus terindeks.

    # Blokir akses langsung ke file sensitif
    location ~ ^/(config\.inc\.php|\.git|cache/|lib/pkp/tests/|tests/|docs/) { deny all; }

    location ~ ^/public/.*\.(php|phtml|phar|php[0-9]?)$ { deny all; }

    location = /sitemap.xml { rewrite ^ /index/sitemap last; }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # SEMUA path non-file ditulis ulang MENYIMPAN path (last = re-evaluasi
    # location). index.php/some/path baru ditangkap block regex bawah,
    # lalu fastcgi_split_path_info menghasilkan PATH_INFO=/some/path.
    location / {
        try_files $uri $uri/ @ojsroute;
    }
    location @ojsroute {
        rewrite ^/index\.php(/.*)?$ /index.php$1 last;
        rewrite ^/(.*)$ /index.php/$1 last;
    }

    location ~ ^/index\.php(/.*)?$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
    }

    # Aset statis NYATA. Jalur API/_i18n/$$$call$$$ berakhiran .js/.css
    # TIDAK boleh ditangkap di sini (T-50: try_files menelan route API ->
    # 404 statik; di dev router php -S mereka 200). Kecualikan dulu.
    location ~* ^/(?!.*(api/|\$\$\$call\$\$\$)).*\.(css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
